---
name: deploy

on:
  push:
    branches: [main]
  # Nightly rebuild: `npm run build` re-syncs the extension guides (scripts/sync.mjs) from their repositories.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v6

      # `npm run build` runs `prebuild` first: scripts/sync.mjs clones the packages of packages.json.
      - name: Build with Astro.
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages.
        id: deployment
        uses: actions/deploy-pages@v4
