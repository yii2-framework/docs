---
name: deploy

on:
  push:
    branches: [main]
  # Nightly rebuild: `npm run build` re-syncs the extension guides (scripts/sync.mjs) from their repositories.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v6

      # tools/bin/reference (run by `prebuild`) generates the API reference with yii2-apidoc.
      - name: Set up PHP.
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring
          tools: composer
          coverage: none

      - name: Install the reference generator.
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --working-dir tools

      # `npm run build` runs `prebuild` first: scripts/sync.mjs clones the packages of packages.json, then
      # tools/bin/reference writes the API reference and fails when apidoc errors, warnings or unresolved links grow
      # beyond tools/baseline.json. `postbuild` (scripts/check-site.mjs) fails on literal [[ in the guide or broken
      # links in the reference; scripts/llms-sizes.mjs adds the token sizes to llms.txt and fails on missing,
      # unlisted or oversized _llms-txt bundles.
      - name: Build with Astro.
        uses: withastro/action@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages.
        id: deployment
        uses: actions/deploy-pages@v4
