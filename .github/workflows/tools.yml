---
name: tools

on:
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v6

      - name: Set up PHP.
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring
          tools: composer
          coverage: none

      - name: Install dependencies.
        run: composer install --prefer-dist --no-interaction --no-progress --working-dir tools

      - name: Run PHPUnit.
        run: composer test --working-dir tools

      - name: Run PHPStan.
        run: composer analyse --working-dir tools -- --no-progress
